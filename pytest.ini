[pytest]
# Etiquetas dos cenários BDD: cada .feature tem a etiqueta do seu requisito funcional.
# Rodar só um requisito: pytest tests/bdd -m RF07
markers =
    RF01: Autenticar usuário
    RF02: Cadastrar usuário
    RF03: Gerenciar usuários
    RF04: Cadastrar município
    RF05: Listar os relatórios disponíveis
    RF06: Consultar relatório pela tela
    RF07: Pedir relatório pelo chat
    RF08: Restringir os dados ao município do usuário
    RF09: Registrar os acessos aos relatórios (auditoria)
    RF10: Registrar as mensagens do chat para monitorar o modelo
    RF11: Exportar relatório em Excel e PDF
